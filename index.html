<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Food — Доставка еды</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff5252;
            --primary-hover: #ff3333;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-hover: 0 20px 30px -10px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* --- ШАПКА СAЙТА --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #e5e7eb;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo img {
            height: 48px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            font-weight: 600;
            color: var(--text-main);
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* --- HERO-СЕКЦИЯ --- */
        .hero {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero-badge {
            display: inline-block;
            background-color: #fee2e2;
            color: var(--primary-color);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .hero-content h1 {
            font-size: 44px;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }

        .hero-content p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .btn-main {
            display: inline-block;
            background-color: var(--primary-color);
            color: #fff;
            font-weight: 700;
            padding: 16px 36px;
            border-radius: var(--radius-md);
            font-size: 16px;
            box-shadow: 0 10px 20px rgba(255, 82, 82, 0.3);
            transition: all 0.2s ease;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(255, 82, 82, 0.4);
        }

        .hero-image img {
            width: 100%;
            max-width: 550px;
            height: auto;
            border-radius: var(--radius-lg);
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.1));
        } /* --- МЕНЮ --- */
        main {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 24px;
        }

        .section-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 32px;
            letter-spacing: -0.01em;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
        }

        .menu-card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .menu-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .menu-card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #f3f4f6;
        }

        .menu-card-body {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-card-title {
            font-size: 20px;
            font-weight: 700;
        }

        .menu-card-btn {
            background-color: #f3f4f6;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            transition: all 0.2s;
        }

        .menu-card:hover .menu-card-btn {
            background-color: var(--primary-color);
            color: #fff;
        }

        /* --- ПОДВАЛ (FOOTER) --- */
        footer {
            background-color: #111827;
            color: #9ca3af;
            padding: 48px 24px 32px;
            margin-top: 80px;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 24px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 32px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a:hover {
            color: #fff;
        }

        .social-links {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .social-links img {
            width: 36px;
            height: 36px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .social-links img:hover {
            opacity: 1;
        }

        .footer-bottom {
            max-width: 1200px;
            margin: 24px auto 0;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        /* --- АДАПТИВНОСТЬ МБ. УСТРОЙСТВ --- */
        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 24px;
            }

            .hero-content h1 {
                font-size: 32px;
            }

            .nav-links {
                display: none;
            }

            .footer-container {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <nav>
            <a href="#" class="logo">
                <img alt="Логотип Vintage Food" src="images/logo.png">
            </a>
            <ul class="nav-links">
                <li><a href="#">Главная</a></li>
                <li><a href="#menu">Меню</a></li>
                <li><a href="#">Акции</a></li>
                <li><a href="#">О нас</a></li>
            </ul>
        </nav>
    </header> <!-- Первый экран (Hero) -->
